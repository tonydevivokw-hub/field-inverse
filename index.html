<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Field Inverse beta ended</title>
<style>
:root{--bg:#eef1f3;--fg:#18232c;--muted:#5b6b78;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11181e;--fg:#e4ebf0;--muted:#93a4b2;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:64px 20px}
h1{font-size:28px;line-height:1.2;margin:0 0 16px}
p{margin:0 0 14px}
.m{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<h1>The Field Inverse beta has ended</h1>
<p>Thank you for testing it. This early version is no longer available.</p>
<p class="m">If you added it to your home screen, you can remove the icon.</p>
</main>
<script>
// remove the old offline copy from this device
try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())) }catch(e){}
try{ if('caches' in window) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))) }catch(e){}
</script>
</body>
</html>
